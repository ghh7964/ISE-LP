<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뽑기, 정말 이득일까?</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/deck.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="frame">
  <div id="app">
    <canvas id="gl"></canvas>

    <!-- 무대 위 평면 정보 레이어 (지도안 패널 오른쪽 영역에 맞춰짐) -->
    <div id="stage">
      <div id="pins"></div>
      <div id="overlays"></div>
    </div>

    <!-- 지도안 원문 패널 -->
    <aside id="doc">
      <header id="doc-head">
        <div class="doc-kicker">수업지도안 원문</div>
        <div id="doc-speaker"></div>
      </header>
      <div id="doc-scroll"><article id="doc-body"></article></div>
    </aside>

    <!-- 레터박스 -->
    <div class="lb lb-top"></div>
    <div class="lb lb-bottom"></div>

    <div id="flash"></div>
    <div id="blackout"></div>
    <div id="toast"></div>
    <div id="boot">불러오는 중…</div>
  </div>
</div>

<!-- 라이브러리 (버전 고정) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<!-- 부팅 감시: 라이브러리가 막혀 영원히 "불러오는 중…"에 머무르지 않게, 무엇이 빠졌는지 알려 준다 -->
<script>
  setTimeout(function () {
    if (window.D && D.engine && D.engine.ready) return;
    var boot = document.getElementById('boot');
    if (!boot || boot.textContent.indexOf('실패') >= 0) return;
    var miss = [];
    if (typeof gsap === 'undefined') miss.push('GSAP (cdnjs.cloudflare.com)');
    if (typeof marked === 'undefined') miss.push('marked (cdn.jsdelivr.net)');
    if (!window.THREE) miss.push('three.js (cdn.jsdelivr.net)');
    boot.innerHTML = '불러오지 못했습니다' + (miss.length ? ': ' + miss.join(', ') : '') +
      '<br><small>인터넷 연결을 확인하고 F5로 새로고침하세요. 학교망에서 위 주소가 막혔다면 휴대폰 핫스팟으로 연결해 보세요.</small>';
  }, 12000);
</script>

<!-- 마크다운 스냅숏 (file:// 로 열 때 사용, sync.py 가 생성) -->
<script src="content/jidoan.snapshot.js"></script>
<script src="content/script.snapshot.js"></script>

<!-- three.js 를 전역으로 올린 뒤 나머지 스크립트를 순서대로 불러온다.
     자체 스크립트는 일반 스크립트라 file:// 로 더블클릭해도 동작한다. -->
<script type="module">
  import * as THREE_NS from 'three';
  import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
  import { HorizontalTiltShiftShader } from 'three/addons/shaders/HorizontalTiltShiftShader.js';
  import { VerticalTiltShiftShader } from 'three/addons/shaders/VerticalTiltShiftShader.js';

  window.THREE = Object.assign({}, THREE_NS, {
    RoundedBoxGeometry, EffectComposer, RenderPass, ShaderPass, OutputPass,
    HorizontalTiltShiftShader, VerticalTiltShiftShader
  });

  const files = ['core', 'content', 'doc', 'world', 'machine', 'classroom', 'overlays', 'scenes', 'engine'];
  for (const f of files) {
    await new Promise((ok, fail) => {
      const s = document.createElement('script');
      s.src = `js/${f}.js`;
      s.onload = ok;
      s.onerror = () => fail(new Error(`js/${f}.js 를 불러오지 못했습니다`));
      document.body.appendChild(s);
    });
  }
  window.D.boot().catch(err => {
    console.error(err);
    document.getElementById('boot').textContent = '불러오기 실패: ' + err.message;
  });
</script>
</body>
</html>
